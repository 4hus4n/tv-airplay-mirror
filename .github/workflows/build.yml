name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease 2>&1 | tee build.log || {
            grep -E "error:|e: |What went wrong|FAILED|Could not|undefined reference" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AirMirror.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirMirror-apk
          path: AirMirror.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AirMirror v1.0.${{ github.run_number }}
          body: |
            AirPlay screen-mirroring receiver for Android TV.
            Install **AirMirror.apk** on the TV, open it, then on your iPhone: Control Centre → Screen Mirroring → pick the TV.
          files: AirMirror.apk
          make_latest: true
