name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AirMirror.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirMirror-apk
          path: AirMirror.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AirMirror v1.0.${{ github.run_number }}
          body: |
            AirPlay screen-mirroring receiver for Android TV.
            Install **AirMirror.apk** on the TV, open it, then on your iPhone: Control Centre → Screen Mirroring → pick the TV.
          files: AirMirror.apk
          make_latest: true
